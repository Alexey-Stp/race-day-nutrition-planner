name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  # Check which files changed to determine if ui_screenshots should run
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui_screenshots: ${{ steps.filter.outputs.ui_screenshots }}
    steps:
    - uses: actions/checkout@v5
    - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
      id: filter
      with:
        filters: |
          ui_screenshots:
            - 'src/RaceDay.Web.React/**'
            - '.github/workflows/pr_check.yml'

  build-and-test:
    runs-on: ubuntu-latest
    name: Build, Test & Quality Check
    outputs:
      dotnet-build-cache-key: ${{ steps.dotnet-cache.outputs.cache-hit }}
      npm-build-cache-key: ${{ steps.npm-cache.outputs.cache-hit }}

    steps:
    - uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    
    - name: Cache NuGet packages
      id: dotnet-cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: src/RaceDay.Web.React/package-lock.json
    
    - name: Restore .NET dependencies
      run: dotnet restore
    
    - name: Build .NET Solution
      run: dotnet build --configuration Release --no-restore /p:TreatWarningsAsErrors=true --verbosity normal
    
    - name: Run Unit Tests with Code Coverage
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Install ReportGenerator tool
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Merge Coverage Reports
      run: reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./coverage/merged" -reporttypes:Cobertura
    
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      with:
        files: ./coverage/merged/Cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Check Coverage Threshold & Report Low Coverage
      run: |
        python3 - <<'EOF'
        import sys, xml.etree.ElementTree as ET

        path = './coverage/merged/Cobertura.xml'
        root = ET.parse(path).getroot()
        overall = float(root.attrib.get('line-rate', '0'))
        pct = round(overall * 100, 1)

        print("\n" + "=" * 60)
        print("📊 CODE COVERAGE REPORT")
        print("=" * 60)
        icon = "✅" if overall >= 0.80 else "❌"
        print(f"{icon} Overall Coverage: {pct}% (Target: 80%)\n")

        print("📁 Classes with Low Coverage (< 50%):")
        for cls in root.iter('class'):
            rate = float(cls.attrib.get('line-rate', '0'))
            if rate < 0.50:
                print(f"  🔴 {cls.attrib['name']}: {round(rate*100,1)}%")

        print("\n📁 Classes with Medium Coverage (50–79%):")
        for cls in root.iter('class'):
            rate = float(cls.attrib.get('line-rate', '0'))
            if 0.50 <= rate < 0.80:
                print(f"  🟡 {cls.attrib['name']}: {round(rate*100,1)}%")

        print("=" * 60)
        if overall < 0.80:
            print("⚠️  Coverage check FAILED")
            sys.exit(1)
        print("✅ Coverage check PASSED")
        EOF
    
    - name: Install React dependencies
      run: npm ci --ignore-scripts
      working-directory: src/RaceDay.Web.React
      continue-on-error: false
    
    - name: Build React Application
      run: npm run build
      working-directory: src/RaceDay.Web.React
      continue-on-error: false
    
    - name: Upload React Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: react-build
        path: src/RaceDay.Web.React/dist
        retention-days: 1
    
    # Single-path upload so the artifact root is the API output folder itself
    # (multi-path uploads strip to the common parent and break the restore path).
    # RaceDay.Core.dll is copied into the API output, so this is all that is
    # needed to run the API.
    - name: Upload API Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-build
        path: src/RaceDay.API/bin/Release/net10.0
        if-no-files-found: error
        retention-days: 1

  web-lint:
    runs-on: ubuntu-latest
    name: TypeScript & React Lint
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: src/RaceDay.Web.React/package-lock.json
    
    - name: Install dependencies
      run: npm ci --ignore-scripts
      working-directory: src/RaceDay.Web.React
    
    # tsconfig.json is a solution file ("files": []), so build the project
    # references to actually type-check app and node configs.
    - name: TypeScript Check
      run: npx --no-install tsc -b
      working-directory: src/RaceDay.Web.React

    - name: ESLint
      run: npm run lint
      working-directory: src/RaceDay.Web.React

  ui_screenshots:
    runs-on: ubuntu-latest
    name: UI Screenshots (Mobile & Desktop)
    needs: [changes, build-and-test]
    if: needs.changes.outputs.ui_screenshots == 'true'
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: src/RaceDay.Web.React/package-lock.json
    
    - name: Download React Build Artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: react-build
        path: src/RaceDay.Web.React/dist
    
    - name: Download API Build Artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: api-build
        path: src/RaceDay.API/bin/Release/net10.0
    
    - name: Check if builds are needed
      id: check-builds
      run: |
        if [ -f "src/RaceDay.Web.React/dist/index.html" ] && [ -f "src/RaceDay.API/bin/Release/net10.0/RaceDay.API.dll" ]; then
          echo "builds_exist=true" >> $GITHUB_OUTPUT
          echo "✅ Build artifacts exist, skipping rebuild"
        else
          echo "builds_exist=false" >> $GITHUB_OUTPUT
          echo "⚠️ Build artifacts missing, will rebuild"
        fi
    
    - name: Restore .NET dependencies
      if: steps.check-builds.outputs.builds_exist != 'true'
      run: dotnet restore
    
    - name: Build .NET Solution
      if: steps.check-builds.outputs.builds_exist != 'true'
      run: dotnet build --configuration Release --no-restore
    
    # Always needed: vite preview, wait-on and Playwright come from node_modules
    # even when the build output is reused from the build-and-test job.
    - name: Install React dependencies
      run: npm ci --ignore-scripts
      working-directory: src/RaceDay.Web.React
    
    - name: Build React Application
      if: steps.check-builds.outputs.builds_exist != 'true'
      run: npm run build
      working-directory: src/RaceDay.Web.React
    
    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('src/RaceDay.Web.React/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx --no-install playwright install --with-deps chromium
      working-directory: src/RaceDay.Web.React

    # The browser cache only holds the browser binaries; OS packages must be installed on every run
    - name: Install Playwright System Dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx --no-install playwright install-deps chromium
      working-directory: src/RaceDay.Web.React

    # Run the compiled DLL from its output folder (content root = appsettings
    # location); works for both the downloaded artifact and a local rebuild.
    - name: Start API Server
      working-directory: src/RaceDay.API/bin/Release/net10.0
      run: |
        dotnet RaceDay.API.dll &
        API_PID=$!
        echo "API_PID=$API_PID" >> $GITHUB_ENV
        echo "Started API server with PID $API_PID"
      env:
        ASPNETCORE_ENVIRONMENT: Production
        ASPNETCORE_URLS: http://127.0.0.1:8080
    
    - name: Wait for API to be ready
      run: npx --no-install wait-on tcp:127.0.0.1:8080 --timeout 120000
      working-directory: src/RaceDay.Web.React
    
    - name: Start Frontend Preview Server
      run: |
        npm run preview -- --host 127.0.0.1 --port 4173 &
        PREVIEW_PID=$!
        echo "PREVIEW_PID=$PREVIEW_PID" >> $GITHUB_ENV
        echo "Started preview server with PID $PREVIEW_PID"
      working-directory: src/RaceDay.Web.React
      env:
        BASE_URL: http://127.0.0.1:4173
    
    - name: Wait for Preview Server
      run: npx --no-install wait-on http://127.0.0.1:4173 --timeout 60000
      working-directory: src/RaceDay.Web.React
    
    - name: Run Playwright Screenshots
      run: npx --no-install playwright test --project=mobile --project=desktop
      working-directory: src/RaceDay.Web.React
      env:
        BASE_URL: http://127.0.0.1:4173
    
    - name: Stop Servers
      if: always()
      run: |
        if [ ! -z "$API_PID" ]; then kill $API_PID || true; fi
        if [ ! -z "$PREVIEW_PID" ]; then kill $PREVIEW_PID || true; fi
    
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: src/RaceDay.Web.React/playwright-report/
        retention-days: 30
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: src/RaceDay.Web.React/test-results/
        retention-days: 30
    
    - name: Prepare GitHub Pages Content
      if: (success() || failure()) && github.event.pull_request.head.repo.full_name == github.repository
      id: prepare-pages
      run: |
        mkdir -p ui-preview-dist/screenshots/mobile ui-preview-dist/screenshots/desktop

        if [ -d "src/RaceDay.Web.React/playwright-report" ]; then
          cp -r src/RaceDay.Web.React/playwright-report ui-preview-dist/report
        fi

        if [ -d "src/RaceDay.Web.React/test-results/screenshots/mobile" ]; then
          cp src/RaceDay.Web.React/test-results/screenshots/mobile/*.png ui-preview-dist/screenshots/mobile/ 2>/dev/null || true
        fi
        if [ -d "src/RaceDay.Web.React/test-results/screenshots/desktop" ]; then
          cp src/RaceDay.Web.React/test-results/screenshots/desktop/*.png ui-preview-dist/screenshots/desktop/ 2>/dev/null || true
        fi

        echo "📁 Final structure:"
        find ui-preview-dist -type f | sort
    
    - name: Publish to GitHub Pages
      if: (success() || failure()) && github.event.pull_request.head.repo.full_name == github.repository
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./ui-preview-dist
        destination_dir: ui-preview/pr-${{ github.event.pull_request.number }}/latest
        keep_files: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
    
    - name: Extract Repository Info
      if: (success() || failure()) && github.event.pull_request.head.repo.full_name == github.repository
      id: repo-info
      run: |
        REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
        echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
        echo "Repository: ${{ github.repository_owner }}/$REPO_NAME"
    
    - name: Build PR Comment
      if: (success() || failure()) && github.event.pull_request.head.repo.full_name == github.repository
      id: build-comment
      run: |
        BASE_URL="https://${{ github.repository_owner }}.github.io/${{ steps.repo-info.outputs.repo_name }}/ui-preview/pr-${{ github.event.pull_request.number }}/latest"

        COMMENT="<!-- ui-preview-playwright -->"$'\n'
        COMMENT+="## 📸 UI Preview — Mobile & Desktop"$'\n\n'
        COMMENT+="**[📊 Full Playwright Report](${BASE_URL}/report/index.html)**"$'\n\n'

        COMMENT+="### 📱 Mobile (390×844)"$'\n'
        MOBILE_TABLE="| "
        MOBILE_IMAGES="| "

        for f in ui-preview-dist/screenshots/mobile/*.png; do
          [ -f "$f" ] || continue
          NAME=$(basename "$f" .png)
          MOBILE_TABLE+="$NAME | "
          MOBILE_IMAGES+="![$NAME](${BASE_URL}/screenshots/mobile/${NAME}.png) | "
        done

        if [ "$MOBILE_TABLE" != "| " ]; then
          COMMENT+="$MOBILE_TABLE"$'\n'
          COUNT=$(find ui-preview-dist/screenshots/mobile -name "*.png" | wc -l)
          SEP="| "
          for i in $(seq 1 $COUNT); do SEP+="--- | "; done
          COMMENT+="$SEP"$'\n'
          COMMENT+="$MOBILE_IMAGES"$'\n\n'
        else
          COMMENT+="_No mobile screenshots found_"$'\n\n'
        fi

        COMMENT+="### 🖥️ Desktop (1440×900)"$'\n'
        DESKTOP_TABLE="| "
        DESKTOP_IMAGES="| "

        for f in ui-preview-dist/screenshots/desktop/*.png; do
          [ -f "$f" ] || continue
          NAME=$(basename "$f" .png)
          DESKTOP_TABLE+="$NAME | "
          DESKTOP_IMAGES+="![$NAME](${BASE_URL}/screenshots/desktop/${NAME}.png) | "
        done

        if [ "$DESKTOP_TABLE" != "| " ]; then
          COMMENT+="$DESKTOP_TABLE"$'\n'
          COUNT=$(find ui-preview-dist/screenshots/desktop -name "*.png" | wc -l)
          SEP="| "
          for i in $(seq 1 $COUNT); do SEP+="--- | "; done
          COMMENT+="$SEP"$'\n'
          COMMENT+="$DESKTOP_IMAGES"$'\n\n'
        else
          COMMENT+="_No desktop screenshots found_"$'\n\n'
        fi

        COMMENT+="---"$'\n'
        COMMENT+="**Fallback:** [Download artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

        echo "$COMMENT" > /tmp/pr-comment.md
    
    - name: Comment on PR
      if: (success() || failure()) && github.event.pull_request.head.repo.full_name == github.repository
      uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body-path: /tmp/pr-comment.md
        comment-author: 'github-actions[bot]'

