name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    # Fork PRs get a read-only GITHUB_TOKEN, so the PR comment and check annotations would fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # check out the PR commit, not the merge commit
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          pr-mode: false  # changed-code analysis is not available for Qodana Community for .NET
          use-caches: true
          upload-result: true  # the report is kept as the qodana-report workflow artifact
        # No QODANA_TOKEN: the Community linter runs without Qodana Cloud. The current Cloud token
        # (secrets.QODANA_TOKEN_1817300493) is refused by the license server, which fails the scan.
        # Add it back as env QODANA_TOKEN once the Qodana Cloud organization has an active plan.
