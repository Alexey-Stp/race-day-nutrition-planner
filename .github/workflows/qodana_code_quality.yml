name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    # Fork PRs get no secrets, so the scan could not authenticate with Qodana Cloud.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # check out the PR commit, not the merge commit
          fetch-depth: 0  # PR mode needs the full history to diff against the base branch
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1817300493 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
