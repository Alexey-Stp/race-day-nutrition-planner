# Security headers shared by every location.
# nginx only inherits add_header from the enclosing level when a location defines
# none of its own, so each location that adds headers must include this file.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The API is proxied same-origin under /api, so connect-src 'self' is sufficient.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;
