####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
# Qodana Community for .NET: runs on the free Community license (qodana-dotnet needs Ultimate).
# Keep the version in step with the JetBrains/qodana-action version in .github/workflows/qodana_code_quality.yml.
image: jetbrains/qodana-cdnet:2026.2
profile:
  name: qodana.recommended
dotnet:
  solution: RaceDayNutritionPlanner.sln
exclude:
  - name: All
    paths:
      - coverage_local
      - src/RaceDay.Web.React/node_modules
      - src/RaceDay.Web.React/dist
      - src/RaceDay.Web.React/playwright-report
