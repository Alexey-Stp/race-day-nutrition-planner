####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
# Keep this in step with the JetBrains/qodana-action version in .github/workflows/qodana_code_quality.yml.
# The image ships .NET SDK 8.0, 9.0 and 10.0, so net10.0 builds without a bootstrap step.
linter: jetbrains/qodana-dotnet:2026.2
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses
dotnet:
  solution: RaceDayNutritionPlanner.sln
exclude:
  - name: All
    paths:
      - coverage_local
      - src/RaceDay.Web.React/node_modules
      - src/RaceDay.Web.React/dist
      - src/RaceDay.Web.React/playwright-report
